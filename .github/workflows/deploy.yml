name: Build Qt Wasm and Deploy to Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.6.3 requires Emscripten 3.1.37
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.37

      - name: Install Qt 6.6.3 for WebAssembly
        run: |
          pip install -U aqtinstall
          # 1. Install Linux host tools (moc, rcc, qt-cmake)
          aqt install-qt linux desktop 6.6.3 gcc_64 -O "$RUNNER_TEMP/Qt"
          # 2. Install the WebAssembly kit
          aqt install-qt linux desktop 6.6.3 wasm_singlethread -O "$RUNNER_TEMP/Qt"
          # 3. Mark all Qt scripts and binaries as executable on Linux
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/libexec"

      - name: Compile Qt App to WebAssembly
        run: |
          mkdir build
          cd build
          "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin/qt-cmake" .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/6.6.3/gcc_64"
          cmake --build .
          # Automatically finds the generated .html file and copies it to index.html
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -exec cp {} index.html \;

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
