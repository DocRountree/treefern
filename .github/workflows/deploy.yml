name: Build Qt Wasm and Deploy to Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.6.3 requires Emscripten 3.1.37
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.37

      - name: Install Qt 6.6.3 for WebAssembly
        run: |
          pip install -U aqtinstall
          # 1. Install Linux host tools (moc, rcc, qt-cmake)
          aqt install-qt linux desktop 6.6.3 gcc_64 -O "$RUNNER_TEMP/Qt"
          # 2. Install the WebAssembly kit
          aqt install-qt linux desktop 6.6.3 wasm_singlethread -O "$RUNNER_TEMP/Qt"
          # 3. Mark all Qt scripts and binaries as executable on Linux
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/libexec"

      - name: Compile Qt App to WebAssembly
        run: |
          mkdir build
          cd build
          "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin/qt-cmake" .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/6.6.3/gcc_64"
          cmake --build .

          # Create a clean folder for the website files
          mkdir -p dist
          WASM_FILE=$(find . -maxdepth 2 -name "*.wasm" | head -n 1)
          APP_NAME=$(basename "$WASM_FILE" .wasm)
          echo "Detected compiled app name: $APP_NAME"

          # Copy compiled .wasm and .js files
          cp "$(dirname "$WASM_FILE")/$APP_NAME.wasm" dist/
          cp "$(dirname "$WASM_FILE")/$APP_NAME.js" dist/

          # Copy qtloader.js, qtlogo.svg, and generate index.html from Qt's wasm_shell.html
          WASM_PLUGINS="$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/plugins/platforms"
          cp "$WASM_PLUGINS/qtloader.js" dist/
          cp "$WASM_PLUGINS/qtlogo.svg" dist/
          sed "s/@APPNAME@/$APP_NAME/g" "$WASM_PLUGINS/wasm_shell.html" > dist/index.html

          ls -la dist/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
