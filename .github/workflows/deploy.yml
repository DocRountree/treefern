name: Build Qt Wasm and Deploy to Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.6.3 requires Emscripten 3.1.37
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.37

      - name: Install Qt 6.6.3 for WebAssembly
        run: |
          pip install -U aqtinstall
          # 1. Install Linux host tools (moc, rcc, qt-cmake)
          aqt install-qt linux desktop 6.6.3 gcc_64 -O "$RUNNER_TEMP/Qt"
          # 2. Install the WebAssembly kit
          aqt install-qt linux desktop 6.6.3 wasm_singlethread -O "$RUNNER_TEMP/Qt"
          # 3. Mark all Qt scripts and binaries as executable on Linux
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/libexec"

      - name: Compile Qt App to WebAssembly
        run: |
          set -euo pipefail

          # ---- CI-only patches (the repo copy is untouched) ----
          sed -i 's/\badd_executable\b/qt_add_executable/' CMakeLists.txt

          # Leading \n: your CMakeLists.txt has no trailing newline, so a plain
          # echo glues this onto the previous line and CMake rejects it.
          printf '\nif(EMSCRIPTEN)\n  target_link_options(treefern PRIVATE "SHELL:-sASYNCIFY" "SHELL:-sASYNCIFY_STACK_SIZE=1048576" "SHELL:-Os")\nendif()\n' >> CMakeLists.txt

          # QApplication must outlive main()'s stack frame too, not just MainWindow.
          # (It keeps a reference to argc, so that needs to be static as well.)
          sed -i 's/QApplication app(argc, argv);/static int qargc = argc; static QApplication app(qargc, argv);/' main.cpp
          sed -i 's/MainWindow w;/static MainWindow w;/' main.cpp
          # Fill the browser canvas instead of a 1280x800 floating window
          sed -i 's/w\.show();/w.showMaximized();/' main.cpp
          sed -i 's|if (!w.startupPrompt()) return 0;|w.openOrCreate("/tmp/reptiles.json");|' main.cpp

          # ---- Verify every patch applied; fail the build otherwise ----
          grep -q 'qt_add_executable'                   CMakeLists.txt
          grep -q 'SHELL:-sASYNCIFY'                    CMakeLists.txt
          grep -q 'static QApplication app'             main.cpp
          grep -q 'static MainWindow w'                 main.cpp
          grep -q 'w.showMaximized()'                   main.cpp
          grep -q 'openOrCreate("/tmp/reptiles.json")'  main.cpp
          echo "--- patched CMakeLists.txt tail ---"; tail -n 6 CMakeLists.txt
          echo "--- patched main() ---"; sed -n '/^int main/,/^}/p' main.cpp

          mkdir build
          cd build
          "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin/qt-cmake" .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/6.6.3/gcc_64"
          cmake --build .

          mkdir -p dist
          WASM_FILE=$(find . -maxdepth 2 -name "*.wasm" | head -n 1)
          APP_DIR=$(dirname "$WASM_FILE")
          APP_NAME=$(basename "$WASM_FILE" .wasm)

          # Confirm ASYNCIFY actually made it into the link
          grep -q 'Asyncify' "$APP_DIR/$APP_NAME.js" || { echo "ERROR: ASYNCIFY not linked"; exit 1; }

          cp "$APP_DIR/$APP_NAME.wasm" "$APP_DIR/$APP_NAME.js" "$APP_DIR/qtloader.js" "$APP_DIR/qtlogo.svg" dist/
          cp "$APP_DIR/$APP_NAME.html" dist/index.html
          ls -la dist/
