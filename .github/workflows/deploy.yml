name: Build Qt Wasm and Deploy to Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.6.3 requires Emscripten 3.1.37
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.37

      - name: Install Qt 6.6.3 for WebAssembly
        run: |
          pip install -U aqtinstall
          # 1. Install Linux host tools (moc, rcc, qt-cmake)
          aqt install-qt linux desktop 6.6.3 gcc_64 -O "$RUNNER_TEMP/Qt"
          # 2. Install the WebAssembly kit
          aqt install-qt linux desktop 6.6.3 wasm_singlethread -O "$RUNNER_TEMP/Qt"
          # 3. Mark all Qt scripts and binaries as executable on Linux
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/bin"
          chmod -R +x "$RUNNER_TEMP/Qt/6.6.3/gcc_64/libexec"

      - name: Compile Qt App to WebAssembly
        run: |
          # 1. Upgrade add_executable to qt_add_executable
          sed -i 's/\badd_executable\b/qt_add_executable/g' CMakeLists.txt

          # 2. Enable Emscripten ASYNCIFY so QDialog::exec(), QMessageBox::exec(), and QInputDialog work in the browser!
          echo 'target_link_options(treefern PRIVATE "SHELL:-s ASYNCIFY -s ASYNCIFY_STACK_SIZE=65536")' >> CMakeLists.txt

          # 3. Make MainWindow static so it is NOT destroyed when main() yields to the browser event loop!
          sed -i 's/MainWindow w;/static MainWindow w;/g' main.cpp

          # 4. Open/create the sample tree in /tmp/reptiles.json on startup
          sed -i 's/if (!w.startupPrompt()) return 0;/w.openOrCreate("\/tmp\/reptiles.json");/g' main.cpp

          mkdir build
          cd build
          "$RUNNER_TEMP/Qt/6.6.3/wasm_singlethread/bin/qt-cmake" .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/6.6.3/gcc_64"
          cmake --build .

          # Create a clean folder for the website files
          mkdir -p dist
          WASM_FILE=$(find . -maxdepth 2 -name "*.wasm" | head -n 1)
          APP_DIR=$(dirname "$WASM_FILE")
          APP_NAME=$(basename "$WASM_FILE" .wasm)

          cp "$APP_DIR/$APP_NAME.wasm" dist/
          cp "$APP_DIR/$APP_NAME.js" dist/
          cp "$APP_DIR/qtloader.js" dist/
          cp "$APP_DIR/qtlogo.svg" dist/
          cp "$APP_DIR/$APP_NAME.html" dist/index.html

          ls -la dist/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
