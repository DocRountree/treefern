name: Web app

# Publishes main at the site root and the development branch under /dev/.
# Pages holds one deployment at a time, so every run builds both.
on:
  push:
    branches: [main, development]
    paths:
      - 'web/**'
      - 'samples/**'
      - 'packaging/treefern.svg'
      - 'docs/social-preview.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: development, path: development }

      - name: Assemble site
        run: |
          # This run's own checkout supplies the build script, so both copies are built the same way.
          build=${{ github.ref_name == 'development' && 'development' || 'main' }}/web/build-site.sh
          [ -f "$build" ] || build=development/web/build-site.sh
          sh "$build" main _site
          sh "$build" development _site/dev dev

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
