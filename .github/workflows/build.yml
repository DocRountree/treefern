name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach zips to releases on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/treefern.exe dist/
          windeployqt --release --no-translations dist/treefern.exe
          Copy-Item -Recurse samples dist/
          Compress-Archive dist/* treefern-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/treefern.app
          ditto -c -k --keepParent build/treefern.app treefern-macos.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf treefern-linux.tar.gz -C build treefern

      - uses: actions/upload-artifact@v4
        with:
          name: treefern-${{ runner.os }}
          path: treefern-*.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: treefern-*.*
