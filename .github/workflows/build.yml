name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach zips to releases on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}  # macOS build not yet supported
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/treefern.exe dist/
          windeployqt --release --no-translations dist/treefern.exe
          Copy-Item samples/*.json dist/  # samples sit right next to treefern.exe
          Compress-Archive dist/* treefern-windows.zip

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "0.0.0" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=$version packaging/treefern.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/treefern.app
          ditto -c -k --keepParent build/treefern.app treefern-macos.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf treefern-linux.tar.gz -C build treefern

      - uses: actions/upload-artifact@v4
        with:
          name: treefern-${{ runner.os }}
          path: |
            treefern-*.*
            TreeFern-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            treefern-*.*
            TreeFern-Setup.exe
