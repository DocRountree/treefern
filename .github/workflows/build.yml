name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach zips to releases on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]  # oldest Ubuntu: AppImage runs on distros with this glibc or newer
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}  # macOS build not yet supported
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/treefern.exe dist/
          windeployqt --release --no-translations dist/treefern.exe
          Copy-Item samples/*.json dist/  # samples sit right next to treefern.exe
          Compress-Archive dist/* treefern-windows.zip

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "0.0.0" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=$version packaging/treefern.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/treefern.app
          ditto -c -k --keepParent build/treefern.app treefern-macos.zip

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1  # no FUSE on runners
          LDAI_OUTPUT: TreeFern-x86_64.AppImage
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
          base=https://github.com/linuxdeploy
          curl -sSLfO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLfO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          QMAKE="$QT_ROOT_DIR/bin/qmake" ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/treefern \
            -d packaging/treefern.desktop -i packaging/treefern.svg --plugin qt --output appimage
          (cd samples && zip -q ../TreeFern-samples.zip *.json)

      - uses: actions/upload-artifact@v4
        with:
          name: treefern-${{ runner.os }}
          path: |
            treefern-*.*
            TreeFern-Setup.exe
            TreeFern-x86_64.AppImage
            TreeFern-samples.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            treefern-*.*
            TreeFern-Setup.exe
            TreeFern-x86_64.AppImage
            TreeFern-samples.zip
